<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Body -->
  <ellipse cx="100" cy="120" rx="50" ry="60" fill="#ff9933" stroke="#333" stroke-width="2"/>

  <!-- Head -->
  <circle cx="100" cy="60" r="40" fill="#ff9933" stroke="#333" stroke-width="2"/>

  <!-- Left Ear -->
  <polygon points="70,30 75,10 85,35" fill="#ff9933" stroke="#333" stroke-width="2"/>

  <!-- Right Ear -->
  <polygon points="130,30 125,10 115,35" fill="#ff9933" stroke="#333" stroke-width="2"/>

  <!-- Left Eye -->
  <ellipse cx="85" cy="55" rx="8" ry="12" fill="#333"/>
  <ellipse cx="87" cy="52" rx="3" ry="4" fill="#fff"/>

  <!-- Right Eye -->
  <ellipse cx="115" cy="55" rx="8" ry="12" fill="#333"/>
  <ellipse cx="117" cy="52" rx="3" ry="4" fill="#fff"/>

  <!-- Nose -->
  <polygon points="100,65 95,72 105,72" fill="#ff6699"/>

  <!-- Mouth -->
  <path d="M 100 72 Q 90 78 85 75" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M 100 72 Q 110 78 115 75" stroke="#333" stroke-width="2" fill="none"/>

  <!-- Whiskers Left -->
  <line x1="50" y1="60" x2="75" y2="58" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="65" x2="75" y2="65" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="70" x2="75" y2="72" stroke="#333" stroke-width="1.5"/>

  <!-- Whiskers Right -->
  <line x1="150" y1="60" x2="125" y2="58" stroke="#333" stroke-width="1.5"/>
  <line x1="150" y1="65" x2="125" y2="65" stroke="#333" stroke-width="1.5"/>
  <line x1="150" y1="70" x2="125" y2="72" stroke="#333" stroke-width="1.5"/>

  <!-- Left Arm -->
  <ellipse cx="70" cy="130" rx="12" ry="30" fill="#ff9933" stroke="#333" stroke-width="2"/>

  <!-- Right Arm -->
  <ellipse cx="130" cy="130" rx="12" ry="30" fill="#ff9933" stroke="#333" stroke-width="2"/>

  <!-- Left Leg -->
  <ellipse cx="85" cy="170" rx="12" ry="25" fill="#ff9933" stroke="#333" stroke-width="2"/>

  <!-- Right Leg -->
  <ellipse cx="115" cy="170" rx="12" ry="25" fill="#ff9933" stroke="#333" stroke-width="2"/>

  <!-- Tail -->
  <path d="M 145 140 Q 170 130 180 150 Q 185 165 175 175" stroke="#ff9933" stroke-width="15" fill="none" stroke-linecap="round"/>
</svg>
